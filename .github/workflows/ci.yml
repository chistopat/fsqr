name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  goose-image:
    name: Build and Publish Goose Image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      GOOSE_VERSION: v3.27.1
      GOOSE_IMAGE: ghcr.io/${{ github.repository_owner }}/fsqr-goose
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish image
        if: github.event_name != 'pull_request'
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg "GOOSE_VERSION=${GOOSE_VERSION}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${GOOSE_VERSION}" \
            -f build/goose.Dockerfile \
            -t "${GOOSE_IMAGE}:${GOOSE_VERSION}" \
            -t "${GOOSE_IMAGE}:latest" \
            --push \
            .

      - name: Build image for pull requests
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg "GOOSE_VERSION=${GOOSE_VERSION}" \
            -f build/goose.Dockerfile \
            -t "${GOOSE_IMAGE}:${GOOSE_VERSION}" \
            --load \
            .

  hygiene-unit-build:
    name: Hygiene, Unit Tests, Build
    runs-on: ubuntu-24.04
    needs: goose-image
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check gofmt
        run: |
          files="$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
          if [ -n "$files" ]; then
            echo "Files are not gofmt-formatted:"
            echo "$files"
            exit 1
          fi

      - name: Run golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0 run ./... --timeout=5m

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./...

      - name: Run release script tests
        run: python3 -m unittest scripts/next_release_test.py

      - name: Build binary
        run: go build -trimpath -o bin/fsqr ./cmd/fsqr

  e2e:
    name: Docker Compose E2E
    runs-on: ubuntu-24.04
    needs: hygiene-unit-build
    timeout-minutes: 60
    env:
      POSTGRES_USER: fsqr
      POSTGRES_PASSWORD: fsqr
      TEST_POSTGRES_DB: fsqr_test
      FSQR_HOST_PORT: 127.0.0.1:3000
      POSTGRES_HOST_PORT: 127.0.0.1:5432
      TEI_HOST_PORT: 127.0.0.1:8080
      TEI_IMAGE: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
      TEI_PLATFORM: linux/amd64
      TEI_DOCKERFILE: Dockerfile
      GOOSE_RUNNER_IMAGE: ghcr.io/${{ github.repository_owner }}/fsqr-goose:v3.27.1
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Restore TEI model cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: etl/.tmp/hf-cache
          key: tei-${{ runner.os }}-${{ env.TEI_MODEL_ID }}-${{ env.TEI_MODEL_REVISION }}

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Pull runtime images
        run: |
          docker pull "$TEI_IMAGE"
          docker compose -f build/docker-compose.e2e.yml pull --policy missing postgres migrate

      - name: Build fsqr image
        run: docker build -f build/fsqr.Dockerfile -t fsqr:local .

      - name: Start e2e environment
        run: |
          set -euo pipefail
          compose=(docker compose -f build/docker-compose.e2e.yml)

          "${compose[@]}" up -d --no-build postgres tei

          for attempt in {1..60}; do
            if "${compose[@]}" exec -T postgres pg_isready -U "$POSTGRES_USER" -d postgres >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = "60" ]; then
              echo "test postgres did not become ready in time" >&2
              exit 1
            fi
            sleep 1
          done

          "${compose[@]}" exec -T postgres psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d postgres -v db="$TEST_POSTGRES_DB" <<'SQL'
          SELECT format('CREATE DATABASE %I', :'db')
          WHERE NOT EXISTS (
              SELECT 1 FROM pg_database WHERE datname = :'db'
          )
          \gexec
          SQL

          "${compose[@]}" run --rm migrate
          "${compose[@]}" up -d --no-build fsqr

      - name: Wait for services
        run: |
          set -euo pipefail

          for attempt in {1..240}; do
            if curl -fsS "http://127.0.0.1:8080/info" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = "240" ]; then
              echo "tei did not become ready in time" >&2
              exit 1
            fi
            sleep 1
          done

          for attempt in {1..60}; do
            if curl -fsS "http://127.0.0.1:3000/live" >/dev/null 2>&1; then
              exit 0
            fi
            if [ "$attempt" = "60" ]; then
              echo "fsqr api did not become ready in time" >&2
              exit 1
            fi
            sleep 1
          done

      - name: Run e2e tests
        env:
          BASE_URL: http://127.0.0.1:3000
          TEST_DATABASE_URL: postgres://fsqr:fsqr@127.0.0.1:5432/fsqr_test?sslmode=disable
        run: go test -tags=e2e -count=1 -v ./tests

      - name: Dump e2e logs on failure
        if: failure()
        run: |
          docker compose -f build/docker-compose.e2e.yml ps || true
          docker compose -f build/docker-compose.e2e.yml logs --no-color postgres tei fsqr migrate || true

      - name: Tear down e2e environment
        if: always()
        run: docker compose -f build/docker-compose.e2e.yml down -v --remove-orphans || true

  publish:
    name: Tag and Publish Image
    runs-on: ubuntu-24.04
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: python3 scripts/next_release.py

      - name: Build image
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            -f build/fsqr.Dockerfile \
            -t "${IMAGE}:${VERSION}" \
            .

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push image
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker push "${IMAGE}:${VERSION}"
          docker tag "${IMAGE}:${VERSION}" "${IMAGE}:prod"
          docker push "${IMAGE}:prod"
          docker tag "${IMAGE}:${VERSION}" "${IMAGE}:latest"
          docker push "${IMAGE}:latest"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.version.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "Docker image: ${IMAGE}:${VERSION}"
