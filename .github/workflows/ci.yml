name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  goose-image:
    name: Build and Publish Goose Image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      GOOSE_VERSION: v3.27.1
      GOOSE_IMAGE: ghcr.io/${{ github.repository_owner }}/kailas-goose
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish image
        if: github.event_name != 'pull_request'
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg "GOOSE_VERSION=${GOOSE_VERSION}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${GOOSE_VERSION}" \
            -f deployment/goose.Dockerfile \
            -t "${GOOSE_IMAGE}:${GOOSE_VERSION}" \
            -t "${GOOSE_IMAGE}:latest" \
            --push \
            .

      - name: Build image for pull requests
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg "GOOSE_VERSION=${GOOSE_VERSION}" \
            -f deployment/goose.Dockerfile \
            -t "${GOOSE_IMAGE}:${GOOSE_VERSION}" \
            --load \
            .

  hygiene-unit-build:
    name: Hygiene, Unit Tests, Build
    runs-on: ubuntu-24.04
    needs: goose-image
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: apps/fsqr/go.mod
          cache: true
          cache-dependency-path: apps/fsqr/go.sum

      - name: Check gofmt
        run: |
          files="$(gofmt -l $(find apps/fsqr apps/hoppify -name '*.go' -not -path './vendor/*'))"
          if [ -n "$files" ]; then
            echo "Files are not gofmt-formatted:"
            echo "$files"
            exit 1
          fi

      - name: Run golangci-lint
        working-directory: apps/fsqr
        run: GOWORK=off go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0 run ./... --timeout=5m

      - name: Run Hoppify golangci-lint
        working-directory: apps/hoppify
        run: GOWORK=off go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0 run --config ../../.golangci.yml ./... --timeout=5m

      - name: Run go vet
        working-directory: apps/fsqr
        run: GOWORK=off go vet ./...

      - name: Run Hoppify go vet
        working-directory: apps/hoppify
        run: GOWORK=off go vet ./...

      - name: Run unit tests
        working-directory: apps/fsqr
        run: GOWORK=off go test ./...

      - name: Run Hoppify unit tests
        working-directory: apps/hoppify
        run: GOWORK=off go test ./...

      - name: Run release script tests
        run: python3 -m unittest scripts/next_release_test.py

      - name: Validate compose files
        env:
          FSQR_DOMAIN: fsqr.example.test
          GRAFANA_DOMAIN: grafana.fsqr.example.test
          POSTGRES_PASSWORD: fsqr
          GRAFANA_ADMIN_PASSWORD: admin
        run: |
          docker compose -f deployment/compose.local.yml config >/dev/null
          docker compose -f deployment/compose.e2e.yml config >/dev/null
          docker compose -f deployment/compose.prod.yml config >/dev/null

      - name: Build binary
        working-directory: apps/fsqr
        run: GOWORK=off go build -trimpath -o ../../bin/fsqr ./cmd/fsqr

      - name: Build Hoppify binary
        working-directory: apps/hoppify
        run: GOWORK=off go build -trimpath -o ../../bin/hoppify ./cmd/hoppify

  e2e:
    name: Docker Compose E2E
    runs-on: ubuntu-24.04
    needs: hygiene-unit-build
    timeout-minutes: 60
    env:
      POSTGRES_USER: fsqr
      POSTGRES_PASSWORD: fsqr
      TEST_POSTGRES_DB: fsqr_test
      FSQR_HOST_PORT: 127.0.0.1:3000
      HOPPIFY_HOST_PORT: 127.0.0.1:3100
      POSTGRES_HOST_PORT: 127.0.0.1:5432
      TEI_HOST_PORT: 127.0.0.1:8080
      TEI_IMAGE: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
      TEI_PLATFORM: linux/amd64
      TEI_DOCKERFILE: Dockerfile
      GOOSE_RUNNER_IMAGE: ghcr.io/${{ github.repository_owner }}/kailas-goose:v3.27.1
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: apps/fsqr/go.mod
          cache: true
          cache-dependency-path: apps/fsqr/go.sum

      - name: Restore TEI model cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: etl/.tmp/hf-cache
          key: tei-${{ runner.os }}-${{ env.TEI_MODEL_ID }}-${{ env.TEI_MODEL_REVISION }}

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Pull runtime images
        run: |
          docker pull "$TEI_IMAGE"
          docker compose -f deployment/compose.e2e.yml pull --policy missing postgres

      - name: Build fsqr image
        run: docker build -f apps/fsqr/build/Dockerfile -t fsqr:local apps/fsqr

      - name: Build Hoppify image
        run: docker build -f apps/hoppify/build/Dockerfile -t hoppify:local apps/hoppify

      - name: Start e2e environment
        run: |
          set -euo pipefail
          compose=(docker compose -f deployment/compose.e2e.yml)

          "${compose[@]}" up -d --no-build postgres tei

          for attempt in {1..60}; do
            if "${compose[@]}" exec -T postgres pg_isready -U "$POSTGRES_USER" -d postgres >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = "60" ]; then
              echo "test postgres did not become ready in time" >&2
              exit 1
            fi
            sleep 1
          done

          "${compose[@]}" exec -T postgres psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d postgres -v db="$TEST_POSTGRES_DB" <<'SQL'
          SELECT format('CREATE DATABASE %I', :'db')
          WHERE NOT EXISTS (
              SELECT 1 FROM pg_database WHERE datname = :'db'
          )
          \gexec
          SQL

          "${compose[@]}" run --build --rm migrate-fsqr
          "${compose[@]}" up -d --no-build fsqr hoppify

      - name: Wait for services
        run: |
          set -euo pipefail

          for attempt in {1..240}; do
            if curl -fsS "http://127.0.0.1:8080/info" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = "240" ]; then
              echo "tei did not become ready in time" >&2
              exit 1
            fi
            sleep 1
          done

          for attempt in {1..60}; do
            if curl -fsS "http://127.0.0.1:3000/live" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = "60" ]; then
              echo "fsqr api did not become ready in time" >&2
              exit 1
            fi
            sleep 1
          done

          for attempt in {1..60}; do
            if curl -fsS "http://127.0.0.1:3100/live" >/dev/null 2>&1; then
              exit 0
            fi
            if [ "$attempt" = "60" ]; then
              echo "hoppify app did not become ready in time" >&2
              exit 1
            fi
            sleep 1
          done

      - name: Run e2e tests
        env:
          BASE_URL: http://127.0.0.1:3000
          TEST_DATABASE_URL: postgres://fsqr:fsqr@127.0.0.1:5432/fsqr_test?sslmode=disable
        working-directory: apps/fsqr
        run: GOWORK=off go test -tags=e2e -count=1 -v ./tests

      - name: Dump e2e logs on failure
        if: failure()
        run: |
          docker compose -f deployment/compose.e2e.yml ps || true
          docker compose -f deployment/compose.e2e.yml logs --no-color postgres tei fsqr hoppify migrate-fsqr || true

      - name: Tear down e2e environment
        if: always()
        run: docker compose -f deployment/compose.e2e.yml down -v --remove-orphans || true

  publish:
    name: Tag and Publish App Images
    runs-on: ubuntu-24.04
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: python3 scripts/next_release.py

      - name: Build image
        env:
          FSQR_IMAGE: ${{ steps.version.outputs.image }}
          HOPPIFY_IMAGE: ghcr.io/${{ github.repository_owner }}/hoppify
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            -f apps/fsqr/build/Dockerfile \
            -t "${FSQR_IMAGE}:${VERSION}" \
            apps/fsqr
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            -f apps/hoppify/build/Dockerfile \
            -t "${HOPPIFY_IMAGE}:${VERSION}" \
            apps/hoppify

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push image
        env:
          FSQR_IMAGE: ${{ steps.version.outputs.image }}
          HOPPIFY_IMAGE: ghcr.io/${{ github.repository_owner }}/hoppify
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for image in "$FSQR_IMAGE" "$HOPPIFY_IMAGE"; do
            docker push "${image}:${VERSION}"
            docker tag "${image}:${VERSION}" "${image}:prod"
            docker push "${image}:prod"
            docker tag "${image}:${VERSION}" "${image}:latest"
            docker push "${image}:latest"
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FSQR_IMAGE: ${{ steps.version.outputs.image }}
          HOPPIFY_IMAGE: ghcr.io/${{ github.repository_owner }}/hoppify
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          printf 'Docker images:\n- %s:%s\n- %s:%s\n' \
            "$FSQR_IMAGE" "$VERSION" \
            "$HOPPIFY_IMAGE" "$VERSION" > release-notes.md
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file release-notes.md

  deploy-smoke:
    name: Watchtower Deploy Smoke Check
    runs-on: ubuntu-24.04
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 20
    steps:
      - name: Wait for app deployments
        env:
          FSQR_DOMAIN: ${{ vars.FSQR_DOMAIN }}
          HOPPIFY_DOMAIN: ${{ vars.HOPPIFY_DOMAIN }}
        run: |
          set -euo pipefail

          if [ -z "${FSQR_DOMAIN:-}" ] || [ -z "${HOPPIFY_DOMAIN:-}" ]; then
            echo "FSQR_DOMAIN and HOPPIFY_DOMAIN repository variables must be set" >&2
            exit 1
          fi

          fsqr_live_url="https://${FSQR_DOMAIN}/live"
          hoppify_live_url="https://${HOPPIFY_DOMAIN}/live"
          hoppify_page_url="https://${HOPPIFY_DOMAIN}/"
          for attempt in {1..90}; do
            if curl -fsS "$fsqr_live_url" >/dev/null &&
               curl -fsS "$hoppify_live_url" >/dev/null &&
               curl -fsS "$hoppify_page_url" | grep -q "Hoppify"; then
              echo "deployment smoke check passed: $fsqr_live_url, $hoppify_page_url"
              exit 0
            fi
            sleep 10
          done

          echo "deployment smoke check failed: fsqr or hoppify did not become healthy" >&2
          exit 1
