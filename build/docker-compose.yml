name: fsqr

services:
  fsqr:
    image: ${FSQR_IMAGE:-fsqr:local}
    build:
      context: ..
      dockerfile: build/fsqr.Dockerfile
    ports:
      - "${FSQR_HOST_PORT:-127.0.0.1:3000}:3000"
    environment:
      FSQR_ENV: ${FSQR_ENV:-prod}
      FSQR_HTTP_ADDR: ":3000"
      FSQR_METRICS_ADDR: ":3001"
      FSQR_DATABASE_DSN: "postgres://${POSTGRES_USER:-fsqr}:${POSTGRES_PASSWORD:-fsqr}@postgres:5432/${POSTGRES_DB:-fsqr}?sslmode=disable"
      FSQR_EMBEDDINGS_BASE_URL: "http://tei/v1"
      FSQR_EMBEDDINGS_API_KEY: ${FSQR_EMBEDDINGS_API_KEY:-tei-local}
      FSQR_EMBEDDINGS_MODEL: ${TEI_SERVED_MODEL_NAME:-intfloat/multilingual-e5-small}
      FSQR_TRACING_ENABLED: ${FSQR_TRACING_ENABLED:-true}
      FSQR_TRACING_OTLP_ENDPOINT_URL: ${FSQR_TRACING_OTLP_ENDPOINT_URL:-http://jaeger:4317}
      FSQR_TRACING_OTLP_INSECURE: ${FSQR_TRACING_OTLP_INSECURE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      tei:
        condition: service_started
      jaeger:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg18-bookworm}
    ports:
      - "${POSTGRES_HOST_PORT:-127.0.0.1:5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fsqr}
      POSTGRES_USER: ${POSTGRES_USER:-fsqr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fsqr}
    volumes:
      - ../etl/db/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  tei:
    image: "${TEI_IMAGE:-fsqr/tei:cpu-arm64}"
    platform: linux/arm64
    build:
      context: "https://github.com/huggingface/text-embeddings-inference.git#${TEI_REF:-main}"
      dockerfile: Dockerfile-arm64
      target: http
      platforms:
        - linux/arm64
    command:
      - --model-id
      - ${TEI_MODEL_ID:-intfloat/multilingual-e5-small}
      - --revision
      - ${TEI_MODEL_REVISION:-fd1525a9fd15316a2d503bf26ab031a61d056e98}
      - --served-model-name
      - ${TEI_SERVED_MODEL_NAME:-intfloat/multilingual-e5-small}
      - --hostname
      - 0.0.0.0
      - --port
      - "80"
    ports:
      - "${TEI_HOST_PORT:-127.0.0.1:8080}:80"
    volumes:
      - ../etl/.tmp/hf-cache:/data
    environment:
      HUGGINGFACE_HUB_CACHE: /data
      HF_TOKEN: ${HF_TOKEN:-}
    restart: unless-stopped

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:latest}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_HOST_PORT:-127.0.0.1:9090}:9090"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      fsqr:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    ports:
      - "${GRAFANA_HOST_PORT:-127.0.0.1:3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - grafana-data:/var/lib/grafana
      - ../observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../observability/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
      jaeger:
        condition: service_started
    restart: unless-stopped

  jaeger:
    image: ${JAEGER_IMAGE:-jaegertracing/all-in-one:latest}
    ports:
      - "${JAEGER_UI_HOST_PORT:-127.0.0.1:16686}:16686"
      - "${JAEGER_OTLP_GRPC_HOST_PORT:-127.0.0.1:4317}:4317"
      - "${JAEGER_OTLP_HTTP_HOST_PORT:-127.0.0.1:4318}:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
