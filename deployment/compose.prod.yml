name: ${KAILAS_COMPOSE_PROJECT:-fsqr-prod}

services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    depends_on:
      fsqr:
        condition: service_started
      hoppify:
        condition: service_started
      grafana:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      FSQR_DOMAIN: ${FSQR_DOMAIN:?FSQR_DOMAIN must be set}
      HOPPIFY_DOMAIN: ${HOPPIFY_DOMAIN:?HOPPIFY_DOMAIN must be set}
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN:?GRAFANA_DOMAIN must be set}
    volumes:
      - ../gateway/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  fsqr:
    image: ${FSQR_IMAGE:-ghcr.io/chistopat/fsqr:latest}
    environment:
      FSQR_CONFIG_FILE: /app/config/config.yaml
    volumes:
      - ../apps/fsqr/config.yaml:/app/config/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      tei:
        condition: service_started
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped

  hoppify:
    image: ${HOPPIFY_IMAGE:-ghcr.io/chistopat/hoppify:latest}
    environment:
      HOPPIFY_ENV: prod
      HOPPIFY_HTTP_ADDR: ":3000"
      HOPPIFY_METRICS_ADDR: ":3001"
      HOPPIFY_DATABASE_DSN: "host=postgres port=5432 dbname=${HOPPIFY_POSTGRES_DB:-hoppify} user=${HOPPIFY_POSTGRES_USER:-hoppify} password=${HOPPIFY_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}} sslmode=disable"
      HOPPIFY_S3_BUCKET: ${HOPPIFY_S3_BUCKET:-hoppify}
      HOPPIFY_S3_REGION: ${HOPPIFY_S3_REGION:-us-east-1}
      HOPPIFY_S3_ENDPOINT_URL: ${HOPPIFY_S3_ENDPOINT_URL:-}
      HOPPIFY_S3_ACCESS_KEY_ID: ${HOPPIFY_S3_ACCESS_KEY_ID:-}
      HOPPIFY_S3_SECRET_ACCESS_KEY: ${HOPPIFY_S3_SECRET_ACCESS_KEY:-}
      HOPPIFY_S3_SESSION_TOKEN: ${HOPPIFY_S3_SESSION_TOKEN:-}
      HOPPIFY_S3_FORCE_PATH_STYLE: ${HOPPIFY_S3_FORCE_PATH_STYLE:-false}
    depends_on:
      create-hoppify-db:
        condition: service_completed_successfully
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped

  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg18-bookworm}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fsqr}
      POSTGRES_USER: ${POSTGRES_USER:-fsqr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  create-hoppify-db:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg18-bookworm}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-fsqr}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      HOPPIFY_POSTGRES_DB: ${HOPPIFY_POSTGRES_DB:-hoppify}
      HOPPIFY_POSTGRES_USER: ${HOPPIFY_POSTGRES_USER:-hoppify}
      HOPPIFY_POSTGRES_PASSWORD: ${HOPPIFY_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        psql -v ON_ERROR_STOP=1 -d postgres \
          -v db="$${HOPPIFY_POSTGRES_DB}" \
          -v app_user="$${HOPPIFY_POSTGRES_USER}" \
          -v app_password="$${HOPPIFY_POSTGRES_PASSWORD}" <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'app_user', :'app_password')
        WHERE NOT EXISTS (
            SELECT 1 FROM pg_roles WHERE rolname = :'app_user'
        )
        \gexec
        SELECT format('ALTER ROLE %I WITH LOGIN PASSWORD %L', :'app_user', :'app_password')
        \gexec
        SELECT format('CREATE DATABASE %I OWNER %I', :'db', :'app_user')
        WHERE NOT EXISTS (
            SELECT 1 FROM pg_database WHERE datname = :'db'
        )
        \gexec
        SELECT format('ALTER DATABASE %I OWNER TO %I', :'db', :'app_user')
        \gexec
        SQL

  tei:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    platform: ${TEI_PLATFORM:-linux/amd64}
    command:
      - --model-id
      - ${TEI_MODEL_ID:-intfloat/multilingual-e5-small}
      - --revision
      - ${TEI_MODEL_REVISION:-fd1525a9fd15316a2d503bf26ab031a61d056e98}
      - --served-model-name
      - ${TEI_SERVED_MODEL_NAME:-intfloat/multilingual-e5-small}
      - --hostname
      - 0.0.0.0
      - --port
      - "80"
    volumes:
      - hf-cache:/data
    environment:
      HUGGINGFACE_HUB_CACHE: /data
      HF_TOKEN: ${HF_TOKEN:-}
    restart: unless-stopped

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:latest}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      fsqr:
        condition: service_started
      hoppify:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:?GRAFANA_DOMAIN must be set}
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN:?GRAFANA_DOMAIN must be set}/
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - grafana-data:/var/lib/grafana
      - ../observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../observability/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

  migrate-fsqr:
    image: ${GOOSE_RUNNER_IMAGE:-ghcr.io/chistopat/kailas-goose:v3.27.1}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-fsqr}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-fsqr}
    volumes:
      - ../apps/fsqr/migrations:/migrations:ro
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        dsn="postgres://$${PGUSER}:$${PGPASSWORD}@$${PGHOST}:5432/$${PGDATABASE}?sslmode=disable"
        exec goose -dir /migrations postgres "$${dsn}" up

  migrate-hoppify:
    image: ${GOOSE_RUNNER_IMAGE:-ghcr.io/chistopat/kailas-goose:v3.27.1}
    depends_on:
      create-hoppify-db:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGUSER: ${HOPPIFY_POSTGRES_USER:-hoppify}
      PGPASSWORD: ${HOPPIFY_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}
      PGDATABASE: ${HOPPIFY_POSTGRES_DB:-hoppify}
    volumes:
      - ../apps/hoppify/migrations:/migrations:ro
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        dsn="postgres://$${PGUSER}:$${PGPASSWORD}@$${PGHOST}:5432/$${PGDATABASE}?sslmode=disable"
        exec goose -dir /migrations postgres "$${dsn}" up

  watchtower:
    image: ${WATCHTOWER_IMAGE:-containrrr/watchtower:latest}
    command:
      - --label-enable
      - --cleanup
      - --interval
      - ${WATCHTOWER_INTERVAL:-300}
    environment:
      REPO_USER: ${GHCR_USERNAME:-}
      REPO_PASS: ${GHCR_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  hf-cache:
  prometheus-data:
  grafana-data:
