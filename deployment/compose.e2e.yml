name: fsqr-e2e

services:
  fsqr:
    image: ${FSQR_IMAGE:-fsqr:local}
    build:
      context: ../apps/fsqr
      dockerfile: build/Dockerfile
    ports:
      - "${FSQR_HOST_PORT:-127.0.0.1:3000}:3000"
    environment:
      FSQR_ENV: dev
      FSQR_HTTP_ADDR: ":3000"
      FSQR_METRICS_ADDR: ":3001"
      FSQR_DATABASE_DSN: "postgres://${POSTGRES_USER:-fsqr}:${POSTGRES_PASSWORD:-fsqr}@postgres:5432/${TEST_POSTGRES_DB:-fsqr_test}?sslmode=disable"
      FSQR_EMBEDDINGS_BASE_URL: "http://tei/v1"
      FSQR_EMBEDDINGS_API_KEY: ${FSQR_EMBEDDINGS_API_KEY:-tei-local}
      FSQR_EMBEDDINGS_MODEL: ${FSQR_EMBEDDINGS_MODEL:-intfloat/multilingual-e5-small}
      FSQR_WEB_MAPBOX_ACCESS_TOKEN: ${FSQR_WEB_MAPBOX_ACCESS_TOKEN:-}
      FSQR_WEB_MAPBOX_STYLE: ${FSQR_WEB_MAPBOX_STYLE:-mapbox/light-v11}
      FSQR_WEB_DEFAULT_LAT: ${FSQR_WEB_DEFAULT_LAT:-34.790000}
      FSQR_WEB_DEFAULT_LON: ${FSQR_WEB_DEFAULT_LON:-32.460000}
      FSQR_WEB_DEFAULT_ZOOM: ${FSQR_WEB_DEFAULT_ZOOM:-11}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
      MAPBOX_API_KEY: ${MAPBOX_API_KEY:-}
      MAPBOX_STYLE: ${MAPBOX_STYLE:-}
      FSQR_TRACING_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      tei:
        condition: service_started
    restart: unless-stopped

  hoppify:
    image: ${HOPPIFY_IMAGE:-hoppify:local}
    build:
      context: ../apps/hoppify
      dockerfile: build/Dockerfile
    ports:
      - "${HOPPIFY_HOST_PORT:-127.0.0.1:3100}:3000"
      - "${HOPPIFY_METRICS_HOST_PORT:-127.0.0.1:3101}:3001"
    environment:
      HOPPIFY_ENV: e2e
      HOPPIFY_HTTP_ADDR: ":3000"
      HOPPIFY_METRICS_ADDR: ":3001"
      HOPPIFY_DATABASE_DSN: "postgres://${HOPPIFY_POSTGRES_USER:-hoppify}:${HOPPIFY_POSTGRES_PASSWORD:-hoppify}@postgres:5432/${TEST_HOPPIFY_POSTGRES_DB:-hoppify_test}?sslmode=disable"
      HOPPIFY_S3_BUCKET: ${HOPPIFY_S3_BUCKET:-hoppify}
      HOPPIFY_S3_REGION: ${HOPPIFY_S3_REGION:-us-east-1}
      HOPPIFY_S3_ENDPOINT_URL: ${HOPPIFY_S3_ENDPOINT_URL:-http://minio:9000}
      HOPPIFY_S3_ACCESS_KEY_ID: ${HOPPIFY_S3_ACCESS_KEY_ID:-minioadmin}
      HOPPIFY_S3_SECRET_ACCESS_KEY: ${HOPPIFY_S3_SECRET_ACCESS_KEY:-minioadmin}
      HOPPIFY_S3_FORCE_PATH_STYLE: ${HOPPIFY_S3_FORCE_PATH_STYLE:-true}
      HOPPIFY_DETECTOR_MODEL_PATH: /app/models/sku110k-yolo11-s640.onnx
      HOPPIFY_DETECTOR_RUNTIME_LIBRARY_PATH: /app/lib/libonnxruntime.so.1.22.0
      HOPPIFY_BEER_LABEL_MODEL: ${HOPPIFY_BEER_LABEL_MODEL:-chatgpt-5.4-mini}
      HOPPIFY_BEER_LABEL_OPENAI_API_KEY: ${HOPPIFY_BEER_LABEL_OPENAI_API_KEY:-${OPENAI_API_KEY:-}}
      HOPPIFY_BEER_LABEL_OPENAI_BASE_URL: ${HOPPIFY_BEER_LABEL_OPENAI_BASE_URL:-https://api.openai.com/v1}
    depends_on:
      create-hoppify-db:
        condition: service_completed_successfully
      minio-create-bucket:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg18-bookworm}
    ports:
      - "${POSTGRES_HOST_PORT:-127.0.0.1:5432}:5432"
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-fsqr_test}
      POSTGRES_USER: ${POSTGRES_USER:-fsqr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fsqr}
    volumes:
      - postgres-test-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  create-hoppify-db:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg18-bookworm}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-fsqr}
      PGPASSWORD: ${POSTGRES_PASSWORD:-fsqr}
      TEST_HOPPIFY_POSTGRES_DB: ${TEST_HOPPIFY_POSTGRES_DB:-hoppify_test}
      HOPPIFY_POSTGRES_USER: ${HOPPIFY_POSTGRES_USER:-hoppify}
      HOPPIFY_POSTGRES_PASSWORD: ${HOPPIFY_POSTGRES_PASSWORD:-hoppify}
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        psql -v ON_ERROR_STOP=1 -d postgres \
          -v db="$${TEST_HOPPIFY_POSTGRES_DB}" \
          -v app_user="$${HOPPIFY_POSTGRES_USER}" \
          -v app_password="$${HOPPIFY_POSTGRES_PASSWORD}" <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'app_user', :'app_password')
        WHERE NOT EXISTS (
            SELECT 1 FROM pg_roles WHERE rolname = :'app_user'
        )
        \gexec
        SELECT format('ALTER ROLE %I WITH LOGIN PASSWORD %L', :'app_user', :'app_password')
        \gexec
        SELECT format('CREATE DATABASE %I OWNER %I', :'db', :'app_user')
        WHERE NOT EXISTS (
            SELECT 1 FROM pg_database WHERE datname = :'db'
        )
        \gexec
        SELECT format('ALTER DATABASE %I OWNER TO %I', :'db', :'app_user')
        \gexec
        SQL

  tei:
    image: "${TEI_IMAGE:-fsqr/tei:cpu-arm64}"
    platform: ${TEI_PLATFORM:-linux/arm64}
    build:
      context: "https://github.com/huggingface/text-embeddings-inference.git#${TEI_REF:-main}"
      dockerfile: ${TEI_DOCKERFILE:-Dockerfile-arm64}
      target: http
      platforms:
        - ${TEI_PLATFORM:-linux/arm64}
    command:
      - --model-id
      - ${TEI_MODEL_ID:-intfloat/multilingual-e5-small}
      - --revision
      - ${TEI_MODEL_REVISION:-fd1525a9fd15316a2d503bf26ab031a61d056e98}
      - --served-model-name
      - ${TEI_SERVED_MODEL_NAME:-intfloat/multilingual-e5-small}
      - --hostname
      - 0.0.0.0
      - --port
      - "80"
    ports:
      - "${TEI_HOST_PORT:-127.0.0.1:8080}:80"
    volumes:
      - ../etl/.tmp/hf-cache:/data
    environment:
      HUGGINGFACE_HUB_CACHE: /data
      HF_TOKEN: ${HF_TOKEN:-}
    restart: unless-stopped

  migrate-fsqr:
    image: ${GOOSE_RUNNER_IMAGE:-kailas-goose:e2e}
    build:
      context: .
      dockerfile: goose.Dockerfile
      args:
        GOOSE_VERSION: ${GOOSE_VERSION:-v3.27.1}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-fsqr}
      PGPASSWORD: ${POSTGRES_PASSWORD:-fsqr}
      PGDATABASE: ${TEST_POSTGRES_DB:-fsqr_test}
    volumes:
      - ../apps/fsqr/migrations:/migrations:ro
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        dsn="postgres://$${PGUSER}:$${PGPASSWORD}@$${PGHOST}:5432/$${PGDATABASE}?sslmode=disable"
        exec goose -dir /migrations postgres "$${dsn}" up

  migrate-hoppify:
    image: ${GOOSE_RUNNER_IMAGE:-kailas-goose:e2e}
    build:
      context: .
      dockerfile: goose.Dockerfile
      args:
        GOOSE_VERSION: ${GOOSE_VERSION:-v3.27.1}
    depends_on:
      create-hoppify-db:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGUSER: ${HOPPIFY_POSTGRES_USER:-hoppify}
      PGPASSWORD: ${HOPPIFY_POSTGRES_PASSWORD:-hoppify}
      PGDATABASE: ${TEST_HOPPIFY_POSTGRES_DB:-hoppify_test}
    volumes:
      - ../apps/hoppify/migrations:/migrations:ro
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        dsn="postgres://$${PGUSER}:$${PGPASSWORD}@$${PGHOST}:5432/$${PGDATABASE}?sslmode=disable"
        exec goose -dir /migrations postgres "$${dsn}" up

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_HOST_PORT:-127.0.0.1:9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-127.0.0.1:9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-test-data:/data
    restart: unless-stopped

  minio-create-bucket:
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      HOPPIFY_S3_BUCKET: ${HOPPIFY_S3_BUCKET:-hoppify}
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 1
        done
        mc mb --ignore-existing "local/$${HOPPIFY_S3_BUCKET}"

volumes:
  postgres-test-data:
  minio-test-data:
