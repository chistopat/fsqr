name: fsqr-e2e

services:
  fsqr:
    image: ${FSQR_IMAGE:-fsqr:local}
    build:
      context: ../apps/fsqr
      dockerfile: build/Dockerfile
    ports:
      - "${FSQR_HOST_PORT:-127.0.0.1:3000}:3000"
    environment:
      FSQR_ENV: dev
      FSQR_HTTP_ADDR: ":3000"
      FSQR_METRICS_ADDR: ":3001"
      FSQR_DATABASE_DSN: "postgres://${POSTGRES_USER:-fsqr}:${POSTGRES_PASSWORD:-fsqr}@postgres:5432/${TEST_POSTGRES_DB:-fsqr_test}?sslmode=disable"
      FSQR_EMBEDDINGS_BASE_URL: "http://tei/v1"
      FSQR_EMBEDDINGS_API_KEY: ${FSQR_EMBEDDINGS_API_KEY:-tei-local}
      FSQR_EMBEDDINGS_MODEL: ${FSQR_EMBEDDINGS_MODEL:-intfloat/multilingual-e5-small}
      FSQR_WEB_MAPBOX_ACCESS_TOKEN: ${FSQR_WEB_MAPBOX_ACCESS_TOKEN:-}
      FSQR_WEB_MAPBOX_STYLE: ${FSQR_WEB_MAPBOX_STYLE:-mapbox/light-v11}
      FSQR_WEB_DEFAULT_LAT: ${FSQR_WEB_DEFAULT_LAT:-34.790000}
      FSQR_WEB_DEFAULT_LON: ${FSQR_WEB_DEFAULT_LON:-32.460000}
      FSQR_WEB_DEFAULT_ZOOM: ${FSQR_WEB_DEFAULT_ZOOM:-11}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
      MAPBOX_API_KEY: ${MAPBOX_API_KEY:-}
      MAPBOX_STYLE: ${MAPBOX_STYLE:-}
      FSQR_TRACING_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      tei:
        condition: service_started
    restart: unless-stopped

  hoppify:
    image: ${HOPPIFY_IMAGE:-hoppify:local}
    build:
      context: ../apps/hoppify
      dockerfile: build/Dockerfile
    ports:
      - "${HOPPIFY_HOST_PORT:-127.0.0.1:3100}:3000"
    environment:
      HOPPIFY_ENV: e2e
      HOPPIFY_HTTP_ADDR: ":3000"
    restart: unless-stopped

  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg18-bookworm}
    ports:
      - "${POSTGRES_HOST_PORT:-127.0.0.1:5432}:5432"
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-fsqr_test}
      POSTGRES_USER: ${POSTGRES_USER:-fsqr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fsqr}
    volumes:
      - postgres-test-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  tei:
    image: "${TEI_IMAGE:-fsqr/tei:cpu-arm64}"
    platform: ${TEI_PLATFORM:-linux/arm64}
    build:
      context: "https://github.com/huggingface/text-embeddings-inference.git#${TEI_REF:-main}"
      dockerfile: ${TEI_DOCKERFILE:-Dockerfile-arm64}
      target: http
      platforms:
        - ${TEI_PLATFORM:-linux/arm64}
    command:
      - --model-id
      - ${TEI_MODEL_ID:-intfloat/multilingual-e5-small}
      - --revision
      - ${TEI_MODEL_REVISION:-fd1525a9fd15316a2d503bf26ab031a61d056e98}
      - --served-model-name
      - ${TEI_SERVED_MODEL_NAME:-intfloat/multilingual-e5-small}
      - --hostname
      - 0.0.0.0
      - --port
      - "80"
    ports:
      - "${TEI_HOST_PORT:-127.0.0.1:8080}:80"
    volumes:
      - ../etl/.tmp/hf-cache:/data
    environment:
      HUGGINGFACE_HUB_CACHE: /data
      HF_TOKEN: ${HF_TOKEN:-}
    restart: unless-stopped

  migrate-fsqr:
    image: ${GOOSE_RUNNER_IMAGE:-kailas-goose:e2e}
    build:
      context: .
      dockerfile: goose.Dockerfile
      args:
        GOOSE_VERSION: ${GOOSE_VERSION:-v3.27.1}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-fsqr}
      PGPASSWORD: ${POSTGRES_PASSWORD:-fsqr}
      PGDATABASE: ${TEST_POSTGRES_DB:-fsqr_test}
    volumes:
      - ../apps/fsqr/migrations:/migrations:ro
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        dsn="postgres://$${PGUSER}:$${PGPASSWORD}@$${PGHOST}:5432/$${PGDATABASE}?sslmode=disable"
        exec goose -dir /migrations postgres "$${dsn}" up

volumes:
  postgres-test-data:
