app:
  name: hoppify
  env: prod

http:
  addr: ":3000"

logger:
  level: info
  encoding: json
  development: false

database:
  dsn: "host=postgres port=5432 dbname=hoppify user=hoppify password=hoppify sslmode=disable"
  max_open_conns: 8
  max_idle_conns: 4
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m
  connect_timeout: 5s

s3:
  bucket: "hoppify"
  region: "us-east-1"
  endpoint_url: ""
  access_key_id: ""
  secret_access_key: ""
  session_token: ""
  force_path_style: false

upload:
  max_files: 10
  max_file_bytes: 15728640
  max_request_bytes: 157286400
  jpeg_quality: 95

observability:
  service_name: hoppify
  metrics:
    addr: ":3001"
    path: "/metrics"
