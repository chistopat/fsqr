app:
  name: hoppify
  env: prod

http:
  addr: ":3000"

logger:
  level: info
  encoding: json
  development: false

database:
  dsn: "host=postgres port=5432 dbname=hoppify user=hoppify password=hoppify sslmode=disable"
  max_open_conns: 8
  max_idle_conns: 4
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m
  connect_timeout: 5s

s3:
  bucket: "hoppify-kailas-cloud"
  region: "hel1"
  endpoint_url: "https://hel1.your-objectstorage.com"
  access_key_id: ""
  secret_access_key: ""
  session_token: ""
  force_path_style: false

upload:
  max_files: 10
  max_file_bytes: 15728640
  max_request_bytes: 157286400
  jpeg_quality: 95

detector:
  model_path: "models/sku110k-yolo11-s640.onnx"
  runtime_library_path: "/app/lib/libonnxruntime.so.1.22.0"
  image_size: 640
  confidence_threshold: 0.25
  iou_threshold: 0.7
  max_detections: 300

beer_label:
  model: "chatgpt-5.4-mini"
  openai_api_key: ""
  openai_base_url: "https://api.openai.com/v1"
  openai_timeout: 30s

observability:
  service_name: hoppify
  metrics:
    addr: ":3001"
    path: "/metrics"
