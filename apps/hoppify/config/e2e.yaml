app:
  name: hoppify
  env: e2e

http:
  addr: ":3000"

logger:
  level: debug
  encoding: console
  development: true

database:
  dsn: "postgres://hoppify:hoppify@127.0.0.1:5432/hoppify_test?sslmode=disable"
  max_open_conns: 8
  max_idle_conns: 4
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m
  connect_timeout: 5s

s3:
  bucket: "hoppify"
  region: "us-east-1"
  endpoint_url: "http://127.0.0.1:9000"
  access_key_id: "minioadmin"
  secret_access_key: "minioadmin"
  session_token: ""
  force_path_style: true

upload:
  max_files: 10
  max_file_bytes: 15728640
  max_request_bytes: 157286400
  jpeg_quality: 95

observability:
  service_name: hoppify
  metrics:
    addr: "127.0.0.1:3001"
    path: "/metrics"
