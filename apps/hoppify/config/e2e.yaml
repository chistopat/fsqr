app:
  name: hoppify
  env: e2e

http:
  addr: ":3000"

logger:
  level: debug
  encoding: console
  development: true

database:
  dsn: "postgres://hoppify:hoppify@127.0.0.1:5432/hoppify_test?sslmode=disable"
  max_open_conns: 8
  max_idle_conns: 4
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m
  connect_timeout: 5s

s3:
  bucket: "hoppify"
  region: "us-east-1"
  endpoint_url: "http://127.0.0.1:9000"
  access_key_id: "minioadmin"
  secret_access_key: "minioadmin"
  session_token: ""
  force_path_style: true

upload:
  max_files: 10
  max_file_bytes: 15728640
  max_request_bytes: 157286400
  jpeg_quality: 95

detector:
  provider: "onnx"
  model_path: "models/sku110k-yolo11-s640.onnx"
  additional_model_paths:
    - "models/hoppify-yolo11-640n.onnx"
  runtime_library_path: ""
  endpoint_url: ""
  api_key: ""
  timeout: 30s
  image_size: 640
  confidence_threshold: 0.25
  iou_threshold: 0.7
  max_detections: 300

crop_refiner:
  enabled: false
  endpoint_url: ""
  api_key: ""
  timeout: 30s
  image_size: 640
  confidence_threshold: 0.25
  iou_threshold: 0.7

beer_label:
  model: "gpt-5.4-mini"
  openai_api_key: ""
  openai_base_url: "https://api.openai.com/v1"
  openai_timeout: 30s
  gemini_api_key: ""
  gemini_model: "gemini-2.5-flash-lite"
  gemini_timeout: 30s
  recognition_concurrency: 4
  recognition_retries: 2
  recognition_retry_delay: 250ms
  recognition_max_batch_size: 300

observability:
  service_name: hoppify
  metrics:
    addr: "127.0.0.1:3001"
    path: "/metrics"
