openapi: 3.0.3
info:
  title: Hoppify API
  version: 0.1.0
paths:
  /live:
    get:
      summary: Liveness check
      responses:
        "200":
          description: Hoppify is running
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: hoppify
  /api/v1/captures:
    post:
      summary: Upload image captures
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - files
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                    format: binary
              additionalProperties: false
            encoding:
              files:
                contentType: image/jpeg, image/png, image/webp
      responses:
        "201":
          description: Captures were stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapturesResponse"
        "400":
          description: Invalid request or undecodable image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: File or request body is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Unsupported image media type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Object storage failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/detect:
    post:
      summary: Detect objects in a capture image
      description: >
        Runs the configured object detector against a capture image.
        The request references an image previously stored through `POST /api/v1/captures`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetectRequest"
            examples:
              uuid:
                summary: Detect by capture UUID
                value:
                  uuid: 018f7b8e-4d96-7b42-9f64-09e5d3a8e7c1
      responses:
        "200":
          description: Objects were detected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectResponse"
        "400":
          description: Invalid request or undecodable image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Capture UUID was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Unsupported image media type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Object storage failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Detection model is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/crops:
    post:
      summary: Create image crops from known bounding boxes
      description: >
        Cuts JPEG crop captures from an existing capture image using bounding boxes
        already produced by detection. This endpoint does not run inference.
        Repeating the same parent UUID and bounding boxes returns the same crop captures.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CropRequest"
            examples:
              boxes:
                summary: Crop by capture UUID and boxes
                value:
                  uuid: 018f7b8e-4d96-7b42-9f64-09e5d3a8e7c1
                  boxes:
                    - bbox:
                        - 335.08
                        - 700.39
                        - 414.09
                        - 920.65
                      confidence: 0.76799
      responses:
        "201":
          description: Crop captures were stored or already existed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CropResponse"
        "400":
          description: Invalid request, bbox, or undecodable image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Capture UUID was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Unsupported image media type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Object storage failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/beer-labels/identify:
    post:
      summary: Identify a beer label from a stored image
      description: >
        Runs a vision-capable LLM against a stored capture or crop image and stores
        the structured result in Postgres. Repeating the same UUID returns the cached
        result and does not call the model again. The model is not given web search
        or other external tools.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeerLabelIdentifyRequest"
            examples:
              crop:
                summary: Identify by crop UUID
                value:
                  uuid: 3b7eaa56-f7a6-57e1-bff6-552b103bb263
      responses:
        "200":
          description: Beer label recognition result was returned from cache or model inference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeerLabelIdentifyResponse"
        "400":
          description: Invalid JSON request or UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Capture UUID was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Unsupported image media type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Object storage failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Beer label model is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: LLM inference or internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    BeerLabelIdentifyRequest:
      type: object
      required:
        - uuid
      properties:
        uuid:
          type: string
          format: uuid
          description: Capture or crop UUID returned by `POST /api/v1/captures` or `/api/v1/crops`.
          example: 3b7eaa56-f7a6-57e1-bff6-552b103bb263
      additionalProperties: false
    BeerLabelIdentifyResponse:
      type: object
      required:
        - uuid
        - model
        - promptVersion
        - cached
        - result
        - createdAt
      properties:
        uuid:
          type: string
          format: uuid
          example: 3b7eaa56-f7a6-57e1-bff6-552b103bb263
        model:
          type: string
          example: gpt-5.4-mini
        promptVersion:
          type: string
          example: beer-label-v1
        cached:
          type: boolean
          description: True when the result was read from Postgres without calling the model.
          example: false
        result:
          $ref: "#/components/schemas/BeerLabelResult"
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    BeerLabelResult:
      type: object
      required:
        - status
        - container
        - beerName
        - brewery
        - style
        - country
        - abv
        - confidence
        - evidence
        - notes
      properties:
        status:
          type: string
          enum:
            - identified
            - uncertain
            - unreadable
            - not_beer
          example: identified
        container:
          type: string
          enum:
            - bottle
            - can
            - glass
            - other
            - unknown
          example: bottle
        beerName:
          type: string
          nullable: true
          example: Punk IPA
        brewery:
          type: string
          nullable: true
          example: BrewDog
        style:
          type: string
          nullable: true
          example: IPA
        country:
          type: string
          nullable: true
          example: Scotland
        abv:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 100
          example: 5.4
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 0.82
        evidence:
          type: array
          items:
            type: string
          example:
            - Label text appears to include Punk IPA
            - Brewery wordmark appears to read BrewDog
        notes:
          type: string
          nullable: true
          example: Some small text is not readable.
      additionalProperties: false
    DetectRequest:
      type: object
      required:
        - uuid
      properties:
        uuid:
          type: string
          format: uuid
          description: Capture UUID returned by `POST /api/v1/captures`.
          example: 018f7b8e-4d96-7b42-9f64-09e5d3a8e7c1
      additionalProperties: false
    CropRequest:
      type: object
      required:
        - uuid
        - boxes
      properties:
        uuid:
          type: string
          format: uuid
          description: Parent capture UUID returned by `POST /api/v1/captures` or `/api/v1/crops`.
          example: 018f7b8e-4d96-7b42-9f64-09e5d3a8e7c1
        boxes:
          type: array
          minItems: 1
          maxItems: 300
          items:
            $ref: "#/components/schemas/CropBox"
      additionalProperties: false
    CropBox:
      type: object
      required:
        - bbox
      properties:
        bbox:
          type: array
          description: Absolute `[x1, y1, x2, y2]` crop rectangle in parent image pixels.
          minItems: 4
          maxItems: 4
          items:
            type: number
            format: float
          example:
            - 335.08
            - 700.39
            - 414.09
            - 920.65
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Optional detector confidence carried by the caller. It is not persisted.
          example: 0.76799
      additionalProperties: false
    CropResponse:
      type: object
      required:
        - uuid
        - crops
      properties:
        uuid:
          type: string
          format: uuid
          description: Parent capture UUID used as the crop source.
          example: 018f7b8e-4d96-7b42-9f64-09e5d3a8e7c1
        crops:
          type: array
          items:
            $ref: "#/components/schemas/CropCapture"
      additionalProperties: false
    CropCapture:
      type: object
      required:
        - uuid
        - type
        - uri
      properties:
        uuid:
          type: string
          format: uuid
          example: 3b7eaa56-f7a6-57e1-bff6-552b103bb263
        type:
          type: string
          example: image_crop
        uri:
          type: string
          example: s3://hoppify/captures/crops/018f7b8e-4d96-7b42-9f64-09e5d3a8e7c1/3b7eaa56-f7a6-57e1-bff6-552b103bb263.jpg
    DetectResponse:
      type: object
      required:
        - images
        - metadata
      properties:
        images:
          type: array
          description: List of processed images. Hoppify detect processes one image per request.
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/DetectImageResult"
        metadata:
          $ref: "#/components/schemas/DetectMetadata"
      additionalProperties: false
    DetectImageResult:
      type: object
      required:
        - shape
        - results
        - speed
      properties:
        shape:
          type: array
          description: Original image dimensions in Ultralytics `[height, width]` format.
          minItems: 2
          maxItems: 2
          items:
            type: integer
            minimum: 1
          example:
            - 720
            - 1280
        results:
          type: array
          description: Detections ordered by descending confidence after NMS.
          items:
            $ref: "#/components/schemas/Detection"
        speed:
          $ref: "#/components/schemas/DetectSpeed"
      additionalProperties: false
    DetectSpeed:
      type: object
      properties:
        preprocess:
          type: number
          format: float
          minimum: 0
          description: Preprocess time in milliseconds.
          example: 1.2
        inference:
          type: number
          format: float
          minimum: 0
          description: ONNX inference time in milliseconds.
          example: 12.5
        postprocess:
          type: number
          format: float
          minimum: 0
          description: Postprocess time in milliseconds.
          example: 2.3
      additionalProperties: false
    DetectMetadata:
      type: object
      required:
        - uuid
        - imageCount
        - functionTimeCall
      properties:
        uuid:
          type: string
          format: uuid
          description: Capture UUID used as the inference source.
          example: 018f7b8e-4d96-7b42-9f64-09e5d3a8e7c1
        imageCount:
          type: integer
          minimum: 1
          example: 1
        functionTimeCall:
          type: number
          format: float
          minimum: 0
          description: Total request processing time in seconds.
          example: 0.018
      additionalProperties: false
    Detection:
      type: object
      required:
        - name
        - class
        - confidence
        - box
      properties:
        name:
          type: string
          description: Class name.
          example: object
        class:
          type: integer
          minimum: 0
          description: Class ID.
          example: 0
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 0.9134
        box:
          $ref: "#/components/schemas/BoundingBox"
      additionalProperties: false
    BoundingBox:
      type: object
      description: Absolute bounding box in original image pixels, using `[x1, y1, x2, y2]` coordinates.
      required:
        - x1
        - y1
        - x2
        - y2
      properties:
        x1:
          type: number
          format: float
          example: 112.4
        y1:
          type: number
          format: float
          example: 45.8
        x2:
          type: number
          format: float
          example: 180.2
        y2:
          type: number
          format: float
          example: 132.6
      additionalProperties: false
    CapturesResponse:
      type: object
      required:
        - captures
      properties:
        captures:
          type: array
          items:
            $ref: "#/components/schemas/Capture"
    Capture:
      type: object
      required:
        - uuid
        - type
        - uri
      properties:
        uuid:
          type: string
          format: uuid
          example: 018f7b8e-4d96-7b42-9f64-09e5d3a8e7c1
        type:
          type: string
          example: image
        uri:
          type: string
          example: s3://hoppify/captures/image/018f7b8e-4d96-7b42-9f64-09e5d3a8e7c1.jpg
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - payload_too_large
                - unsupported_media_type
                - storage_error
                - not_found
                - model_unavailable
                - inference_error
                - internal_error
            message:
              type: string
